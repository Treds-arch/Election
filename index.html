<style>
html, body { margin: 0; padding: 0; min-height: 100%; background: #FFF6E4; }

#pemilu {
  /* Palet diambil dari banner Kencana Muda 2026: emas jingga, cokelat sepia, tinta wayang */
  --gold:#F5A83C;
  --gold-lift:#FFC96B;
  --gold-soft:#FFE6BD;
  --ember:#E37024;
  --ink:#2A1608;
  --ink-2:#4A2810;
  --sepia:#7A3E14;
  --parchment:#FFF6E4;
  --parchment-2:#FBEAC7;
  --card:#FFFFFF;
  --edge:#E8D5B0;
  --edge-soft:#F3E4C6;
  --mute:#8C6A44;
  --go:#2E7A4F;
  --stop:#B7302B;

  /* Font stack ala ema.co: sans-serif modern dengan huruf a double-story.
     Prioritas Inter (kalau di-cache di OS/browser modern), lalu system font
     yang paling menyerupai: SF Pro Text di Mac/iOS, Segoe UI Variable di
     Windows 11, Roboto di Android. Aman di sandbox, gak butuh fetch. */
  --display: "Inter", "SF Pro Display", "Segoe UI Variable Display",
             "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
             "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
          -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue",
          Arial, sans-serif;

  font-family: var(--body);
  color: var(--ink);
  min-height: 100vh;
  padding: 14px 12px 140px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: var(--parchment);
  transition: background .35s ease;
  position: relative;
  overflow-x: hidden;
}
#pemilu * { box-sizing: border-box; }

/* backdrop batik/awan yang halus, dibuat dari SVG inline, aman di sandbox */
#pemilu::before {
  content: "";
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(85% 55% at 50% 0%, rgba(245,168,60,.28), transparent 65%),
    radial-gradient(60% 40% at 100% 100%, rgba(227,112,36,.15), transparent 70%),
    radial-gradient(60% 40% at 0% 100%, rgba(122,62,20,.10), transparent 70%);
}
#pemilu.booth { background: linear-gradient(180deg, #FFD48A 0%, #F5A83C 48%, #C96A22 82%, #A9541A 100%); }
#pemilu.booth::before {
  background:
    radial-gradient(95% 60% at 50% 6%, rgba(255,240,205,.6), transparent 68%),
    radial-gradient(70% 45% at 100% 96%, rgba(60,20,4,.30), transparent 72%),
    radial-gradient(70% 45% at 0% 96%, rgba(60,20,4,.30), transparent 72%);
}

/* ---- awan berlapis di kaki halaman, di bawah maskot ---- */
#pemilu .cloud-band {
  position: fixed; left: 0; right: 0; bottom: 0; height: 92px;
  pointer-events: none; z-index: 2;
  background-repeat: repeat-x;
  background-position: bottom center;
  background-size: auto 92px;
  opacity: 0;
}
#pemilu.booth .cloud-band {
  animation: pemilu-cloud-in 1s .75s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes pemilu-cloud-in { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 520px) {
  #pemilu .cloud-band { height: 66px; background-size: auto 66px; }
}
@media (max-width: 380px) {
  #pemilu .cloud-band { height: 56px; background-size: auto 56px; }
}

/* ---- wayang golek berderet, kiri & kanan saling berhadapan (cermin) ---- */
#pemilu .wayang-band {
  position: fixed; left: 0; right: 0; bottom: 40px;
  pointer-events: none; z-index: 0;
  display: flex; align-items: flex-end; justify-content: center; gap: 34px;
  opacity: 0;
}
#pemilu .wayang-band img {
  height: 122px; width: auto;
  filter: drop-shadow(0 4px 8px rgba(80,30,0,.18));
}
#pemilu .wayang-band img.wy-r { transform: scaleX(-1); }
#pemilu.booth .wayang-band {
  animation: pemilu-band-in 1s .5s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes pemilu-band-in { from { opacity: 0; transform: translateY(20px); } to { opacity: .8; transform: translateY(0); } }
@media (max-width: 520px) {
  #pemilu .wayang-band { height: auto; bottom: 30px; gap: 16px; }
  #pemilu .wayang-band img { height: 88px; }
}
@media (max-width: 380px) {
  #pemilu .wayang-band { bottom: 24px; gap: 10px; }
  #pemilu .wayang-band img { height: 72px; }
}

/* ---- strip logo institusi dari banner ---- */
#pemilu .logo-strip {
  display: block; width: 100%; max-width: 392px; height: auto;
  margin: 0 auto 14px; position: relative; z-index: 2;
  filter: drop-shadow(0 5px 14px rgba(120,55,10,.20));
  animation: pemilu-logo-in .8s cubic-bezier(.2,.8,.3,1) both;
}
@media (max-width: 400px) { #pemilu .logo-strip { max-width: 100%; } }
@keyframes pemilu-logo-in {
  from { opacity: 0; transform: translateY(-14px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
/* Maskot burung wayang berdiri di atas awan */
#pemilu.booth .mascot-bg {
  position: fixed; bottom: 40px; pointer-events: none; z-index: 3;
  height: 178px; width: auto; opacity: 0;
  filter: drop-shadow(0 8px 14px rgba(80,30,0,.3));
}
#pemilu.booth .mascot-bg.left {
  left: -20px;
  animation: pemilu-mascot-in .95s .55s cubic-bezier(.2,.85,.3,1.15) forwards,
             pemilu-bob 4.2s 1.6s ease-in-out infinite;
}
#pemilu.booth .mascot-bg.right {
  right: -20px;
  animation: pemilu-mascot-in .95s .7s cubic-bezier(.2,.85,.3,1.15) forwards,
             pemilu-bob 4.8s 1.9s ease-in-out infinite;
}
@keyframes pemilu-mascot-in {
  from { opacity: 0; transform: translateY(34px) scale(.9); }
  to { opacity: .97; transform: translateY(0) scale(1); }
}
@keyframes pemilu-bob {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-6px) rotate(1.1deg); }
}
@media (max-width: 520px) {
  #pemilu.booth .mascot-bg { height: 126px; bottom: 26px; opacity: .95; }
}
@media (max-width: 380px) {
  #pemilu.booth .mascot-bg { height: 104px; bottom: 22px; }
}
#pemilu .stage { width: 100%; max-width: 460px; position: relative; z-index: 1; }
#pemilu.wide .stage { max-width: 780px; }

/* ---------- typography ---------- */
#pemilu h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(23px, 6.4vw, 32px);
  line-height: 1.05;
  letter-spacing: -0.028em;
  margin: 0 0 6px;
  color: var(--ink);
}
#pemilu.booth h1 { color: var(--ink); text-shadow: 0 1px 0 rgba(255,240,200,.4); }
#pemilu h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -0.018em;
  margin: 0 0 4px;
  color: var(--ink-2);
}
#pemilu .lede { font-size: 13.5px; line-height: 1.5; color: var(--sepia); margin: 0; }
#pemilu.booth .lede { color: var(--ink-2); }

/* ---------- status pill ---------- */
#pemilu .pill {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 600; padding: 0; margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: .18em;
  background: transparent; border: none; color: var(--sepia);
}
#pemilu .pill.live { color: #1F5636; }
#pemilu .pill.shut { color: var(--sepia); opacity: .7; }
#pemilu .pill.admin-open { color: var(--go); }
#pemilu .pill.admin-shut { color: var(--stop); }
#pemilu .dot {
  width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  position: relative;
}
#pemilu .pill.live .dot::before {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  background: currentColor; opacity: .3;
  animation: pemilu-ping 1.8s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes pemilu-ping {
  0% { transform: scale(1); opacity: .35; }
  75%, 100% { transform: scale(2.6); opacity: 0; }
}

/* ---------- surfaces ---------- */
#pemilu .sheet {
  background: var(--card);
  border-radius: 14px;
  padding: 18px;
  border: 1px solid var(--edge);
  box-shadow: 0 2px 0 rgba(80,40,10,.03);
  animation: pemilu-sheet-in .32s cubic-bezier(.2,.85,.3,1) both;
}
@keyframes pemilu-sheet-in { from { opacity: 0; transform: translateY(8px); } }
#pemilu.booth .sheet { border: none; box-shadow: 0 16px 44px rgba(60,25,0,.28); }
#pemilu.wide .sheet { animation: none; }
#pemilu .sheet + .sheet { margin-top: 12px; }
#pemilu .head { margin-bottom: 14px; text-align: center; }
#pemilu .pill { margin-bottom: 8px; }
#pemilu .logo-strip { margin: 0 auto 10px; }

/* ---------- fields ---------- */
#pemilu .field { margin-bottom: 12px; }
#pemilu .field:last-child { margin-bottom: 0; }
#pemilu .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--ink-2); }
#pemilu .field .hint { font-size: 12.5px; color: var(--mute); margin-top: 5px; line-height: 1.5; }
#pemilu input[type=text], #pemilu input[type=password], #pemilu input[type=number] {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--edge); border-radius: 9px;
  background: #FFFDF7; font-size: 15.5px; font-family: var(--body); color: var(--ink);
  transition: border-color .15s;
}
#pemilu input::placeholder { color: #B8A07E; }
#pemilu input:focus { outline: none; border-color: var(--gold); background: #fff; box-shadow: 0 0 0 3px rgba(245,168,60,.18); }

/* ---------- buttons ---------- */
#pemilu button { font-family: var(--body); cursor: pointer; }
#pemilu .btn {
  width: 100%; padding: 12px 16px; border-radius: 10px; border: none;
  font-size: 15.5px; font-weight: 700; letter-spacing: -.005em;
  transition: transform .12s ease, background .15s ease;
}
#pemilu .btn:active:not(:disabled) { transform: translateY(1px); }
#pemilu .btn.solid { background: var(--ink); color: var(--gold-lift); box-shadow: 0 3px 0 var(--sepia); }
#pemilu .btn.solid:hover:not(:disabled) { background: var(--ink-2); }
#pemilu .btn.solid:disabled { background: #D6C8B0; color: #FFF8E6; box-shadow: 0 3px 0 #B7A78A; cursor: not-allowed; }
#pemilu .btn.gold { background: var(--ember); color: #fff; box-shadow: 0 3px 0 #A44A16; }
#pemilu .btn.gold:hover:not(:disabled) { background: #D0651E; }
#pemilu .btn.line { background: #fff; color: var(--ink); border: 1.5px solid var(--edge); }
#pemilu .btn.line:hover { border-color: var(--sepia); }
#pemilu .btn.danger { background: #fff; color: var(--stop); border: 1.5px solid #EFCFCC; }
#pemilu .btn.danger:hover { background: #FDF4F3; }
#pemilu .btn.sm { padding: 9px 14px; font-size: 13.5px; width: auto; }
#pemilu .textlink {
  background: none; border: none; font-size: 13.5px; color: var(--sepia);
  text-decoration: underline; text-underline-offset: 3px; padding: 6px;
}
#pemilu .textlink:hover { color: var(--ink); }
#pemilu.booth .textlink { color: var(--ink-2); }
#pemilu .footer { text-align: center; margin-top: 12px; }

/* ---------- ballot ---------- */
#pemilu .ballot-list { display: grid; gap: 11px; margin-bottom: 18px; }
#pemilu .choice {
  display: flex; align-items: stretch; gap: 13px; width: 100%; text-align: left;
  padding: 13px 14px; border-radius: 13px; border: 1.5px solid var(--edge);
  background: #fff; position: relative; overflow: hidden;
  transition: border-color .2s, background .2s, box-shadow .25s, transform .2s cubic-bezier(.2,.8,.3,1);
  animation: pemilu-slide-in .45s cubic-bezier(.2,.85,.3,1) both;
}
#pemilu .choice::after {
  /* kilau emas menyapu saat kandidat dipilih */
  content: ""; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
  background: linear-gradient(105deg, transparent, rgba(255,214,140,.55), transparent);
  transform: skewX(-18deg); opacity: 0; pointer-events: none;
}
#pemilu .choice[aria-pressed="true"]::after { animation: pemilu-sweep .75s ease-out; }
@keyframes pemilu-sweep {
  0% { left: -60%; opacity: 0; }
  25% { opacity: 1; }
  100% { left: 130%; opacity: 0; }
}
#pemilu .choice:nth-child(1) { animation-delay: .04s; }
#pemilu .choice:nth-child(2) { animation-delay: .10s; }
#pemilu .choice:nth-child(3) { animation-delay: .16s; }
#pemilu .choice:nth-child(4) { animation-delay: .22s; }
#pemilu .choice:nth-child(5) { animation-delay: .28s; }
#pemilu .choice:nth-child(6) { animation-delay: .34s; }
@keyframes pemilu-slide-in { from { opacity: 0; transform: translateY(10px); } }
#pemilu .choice:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(140,70,15,.10); }
#pemilu .choice[aria-pressed="true"] {
  border-color: var(--ink); background: #FFFAEE;
  box-shadow: 0 0 0 3px rgba(245,168,60,.3), 0 10px 26px rgba(140,70,15,.16);
  transform: translateY(-3px);
}
#pemilu .numeral {
  font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1;
  width: 40px; flex: 0 0 40px; border-radius: 11px 0 0 11px;
  display: flex; align-items: center; justify-content: center;
  color: var(--sepia); background: linear-gradient(180deg, #FBF0D9, #F2E2C4);
  border-right: 1.5px solid var(--edge); margin: -13px 0 -13px -14px;
  transition: background .18s, color .18s;
}
#pemilu .choice[aria-pressed="true"] .numeral {
  background: linear-gradient(180deg, var(--ink-2), var(--ink));
  color: var(--gold-lift); border-right-color: var(--ink);
}
#pemilu .photo-slot {
  width: 58px; height: 74px; flex: 0 0 58px; border-radius: 9px;
  background: linear-gradient(160deg, #FBF0D9, #EFDFC0);
  border: 1.5px solid var(--edge); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--sepia); font-family: var(--display); font-weight: 700; font-size: 19px;
  letter-spacing: .02em;
  transition: border-color .18s, box-shadow .18s;
}
#pemilu .choice[aria-pressed="true"] .photo-slot {
  border-color: var(--gold); box-shadow: 0 0 0 2px rgba(245,168,60,.28);
}
#pemilu .photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
#pemilu .ph-person {
  width: 54%; height: auto; display: block;
  fill: var(--sepia); opacity: .38;
  transition: opacity .18s, fill .18s;
}
#pemilu .choice[aria-pressed="true"] .ph-person { opacity: .55; fill: var(--ember); }
#pemilu .photo-pair .ph-person { width: 42%; }
#pemilu .photo-pair { display: flex; flex-direction: column; gap: 4px; flex: 0 0 58px; }
#pemilu .photo-pair .photo-slot { width: 58px; height: 35px; font-size: 13px; }

#pemilu .choice-body {
  display: block; flex: 1; min-width: 0; align-self: center;
  padding-right: 2px;
}
#pemilu .choice-role {
  display: block;
  font-size: 9.5px; font-weight: 700; letter-spacing: .16em;
  color: var(--sepia); text-transform: uppercase; opacity: .78;
  margin-bottom: 4px;
}
#pemilu .choice-name {
  display: block;
  font-family: var(--display); font-weight: 800; font-size: 17px;
  letter-spacing: -.015em; color: var(--ink); line-height: 1.24;
  overflow-wrap: anywhere;
}
#pemilu .choice-mate {
  display: block; font-size: 13px; color: var(--ink-2);
  margin-top: 3px; line-height: 1.35; overflow-wrap: anywhere;
}
#pemilu .choice-mate .lbl {
  color: var(--mute); font-size: 11.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
}
#pemilu .choice-visi {
  display: block; font-size: 12.5px; color: var(--mute);
  margin-top: 7px; padding-top: 7px; line-height: 1.5;
  border-top: 1px solid var(--edge-soft);
  overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
#pemilu .tick {
  align-self: center; width: 23px; height: 23px; flex: 0 0 23px; border-radius: 50%;
  border: 2px solid var(--edge); position: relative; background: #fff;
  transition: border-color .18s, background .18s, transform .18s cubic-bezier(.2,.8,.3,1.4);
}
#pemilu .choice:hover .tick { border-color: var(--gold); }
#pemilu .choice[aria-pressed="true"] .tick {
  border-color: var(--ink); background: var(--gold); transform: scale(1.1);
}
#pemilu .choice[aria-pressed="true"] .tick::after {
  content: ""; position: absolute; left: 7px; top: 3px; width: 5px; height: 11px;
  border: solid var(--ink); border-width: 0 2.5px 2.5px 0; transform: rotate(42deg);
  animation: pemilu-tick .25s ease;
}
@keyframes pemilu-tick { from { opacity: 0; transform: rotate(42deg) scale(.5); } }

/* ---------- confirm sheet ----------
   Di sandbox artifact, position:fixed sering rusak karena iframe-nya
   lebih tinggi dari viewport parent. Solusi: scrim absolute setinggi
   iframe, modal absolute yang di-position via JS di dekat area klik. */
#pemilu .scrim {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  width: 100%; min-height: 100%;
  background: rgba(30,10,0,.62); backdrop-filter: blur(4px);
  z-index: 9999;
  animation: pemilu-fade .2s ease;
  box-sizing: border-box;
}
#pemilu .modal {
  position: absolute; left: 50%; transform: translateX(-50%);
  background: var(--parchment); border-radius: 16px; padding: 0;
  width: calc(100% - 32px); max-width: 420px;
  animation: pemilu-rise .3s cubic-bezier(.2,.8,.3,1);
  border: 1.5px solid var(--sepia); overflow: hidden;
  box-shadow: 0 30px 60px rgba(30,10,0,.5);
}
@keyframes pemilu-fade { from { opacity: 0 } }
@keyframes pemilu-rise { from { transform: translate(-50%, 24px) scale(.96); opacity: .4 } to { transform: translateX(-50%) scale(1); opacity: 1 } }
#pemilu .modal-strap {
  background: var(--ink); color: var(--gold-lift); padding: 10px 20px;
  font-family: var(--display); font-weight: 700; letter-spacing: .18em; font-size: 10.5px;
  text-transform: uppercase; text-align: center;
  border-bottom: 3px double var(--gold);
}
#pemilu .modal-body { padding: 18px 20px 16px; }
#pemilu .modal-body h2 { text-align: center; font-size: 18px; margin-bottom: 5px; }
#pemilu .modal-body .subtle { text-align: center; font-size: 13px; color: var(--sepia); margin: 0; line-height: 1.45; }
#pemilu .confirm-card {
  display: flex; align-items: center; gap: 11px; padding: 11px 12px;
  background: #fff; border-radius: 10px; margin: 13px 0 11px;
  border: 1.5px solid var(--gold);
}
#pemilu .confirm-card .numeral {
  width: 36px; flex: 0 0 36px; height: 38px; margin: 0; border-radius: 9px;
  border: 1.5px solid var(--edge); border-right-width: 1.5px; font-size: 18px;
}
#pemilu .confirm-line {
  font-size: 12px; color: var(--mute); text-align: center; margin-bottom: 13px;
  padding: 7px 12px; background: rgba(245,168,60,.12); border-radius: 8px; line-height: 1.45;
}
#pemilu .modal-actions { display: grid; gap: 8px; padding: 0 20px 18px; }

/* ---------- celebration dengan maskot wayang di layar sukses ---------- */
#pemilu .celebrate {
  position: relative;
  padding: 30px 20px 24px;
  overflow: hidden;
  min-height: 220px;
}
#pemilu .celebrate::before {
  /* radial glow emas di belakang */
  content: "";
  position: absolute;
  left: 50%; top: 40%; transform: translate(-50%, -50%);
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(245,168,60,.35) 0%, rgba(245,168,60,.15) 40%, transparent 65%);
  z-index: 0;
  animation: pemilu-glow 3.5s ease-in-out infinite;
}
@keyframes pemilu-glow { 0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)} }
#pemilu .celebrate-inner { position: relative; z-index: 1; text-align: center; }
#pemilu .mascots {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 14px;
  height: 130px;
}
#pemilu .mascot {
  height: 130px;
  width: auto;
  filter: drop-shadow(0 8px 16px rgba(80,30,0,.25));
}
#pemilu .mascot.left { animation: pemilu-mascot-l 1.2s cubic-bezier(.2,.8,.3,1.2) both; }
#pemilu .mascot.right { animation: pemilu-mascot-r 1.2s .15s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes pemilu-mascot-l {
  0% { opacity: 0; transform: translateX(-40px) translateY(20px) rotate(-8deg); }
  60% { transform: translateX(0) translateY(-6px) rotate(3deg); }
  100% { opacity: 1; transform: translateX(0) translateY(0) rotate(0); }
}
@keyframes pemilu-mascot-r {
  0% { opacity: 0; transform: translateX(40px) translateY(20px) rotate(8deg); }
  60% { transform: translateX(0) translateY(-6px) rotate(-3deg); }
  100% { opacity: 1; transform: translateX(0) translateY(0) rotate(0); }
}
#pemilu .sparkle {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold-lift);
  box-shadow: 0 0 12px 4px rgba(255,201,107,.7);
  animation: pemilu-sparkle 1.6s ease-out forwards;
  z-index: 2;
}
@keyframes pemilu-sparkle {
  0% { opacity: 0; transform: scale(0); }
  30% { opacity: 1; transform: scale(1.4); }
  100% { opacity: 0; transform: scale(.6) translateY(-30px); }
}

/* ---------- kembar tualang / print jempol ---------- */
#pemilu .print-wrap { text-align: center; padding: 8px 0 4px; }
#pemilu .print { width: 100px; height: 118px; margin: 0 auto 20px; position: relative; }
#pemilu .print svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#pemilu .print .ghost { color: var(--edge); }
#pemilu .print .inked { color: var(--ember); clip-path: inset(100% 0 0 0); animation: pemilu-dip 1.1s .15s cubic-bezier(.3,.7,.3,1) forwards; }
@keyframes pemilu-dip { to { clip-path: inset(0 0 0 0); } }

/* ---------- podium pemenang ---------- */
#pemilu .podium-stage {
  position: relative;
  margin: -22px -22px 18px;
  padding: 26px 12px 0;
  overflow: hidden;
  border-radius: 14px 14px 0 0;
  background: radial-gradient(120% 95% at 50% 78%, #FFD98F 0%, #F5A83C 42%, #D97A22 74%, #B65F1A 100%);
}
#pemilu .podium-stage::before {
  content: "";
  position: absolute; left: 50%; top: 78%;
  width: 260%; height: 260%; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 0deg,
    rgba(255,255,255,.20) 0deg 3.2deg, rgba(255,255,255,0) 3.2deg 7.4deg);
  animation: pemilu-rays 90s linear infinite;
  pointer-events: none;
}
@keyframes pemilu-rays { to { transform: translate(-50%, -50%) rotate(360deg); } }
#pemilu .podium-stage::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
  background: linear-gradient(180deg, transparent, rgba(90,40,8,.22));
  pointer-events: none;
}

#pemilu .podium-row {
  position: relative; z-index: 2;
  display: flex; align-items: flex-end; justify-content: center; gap: 6px;
}
#pemilu .pod-col {
  flex: 1 1 0; min-width: 0; max-width: 168px;
  display: flex; flex-direction: column; align-items: center;
  animation: pemilu-pod-rise .75s cubic-bezier(.18,.86,.32,1.08) both;
}
#pemilu .pod-col.r2 { animation-delay: .10s; }
#pemilu .pod-col.r1 { animation-delay: .32s; }
#pemilu .pod-col.r3 { animation-delay: .54s; }
@keyframes pemilu-pod-rise {
  from { opacity: 0; transform: translateY(46px) scale(.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

#pemilu .pod-name {
  font-family: var(--display); font-weight: 800; color: #fff;
  font-size: 12.5px; line-height: 1.2; letter-spacing: -.01em;
  text-align: center; text-transform: uppercase;
  text-shadow: 0 2px 5px rgba(90,35,5,.45);
  margin-bottom: 5px; width: 100%;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
#pemilu .pod-col.r1 .pod-name { font-size: 14px; }
#pemilu .pod-mate {
  display: block; font-weight: 600; font-size: 10.5px;
  text-transform: none; opacity: .92; margin-top: 1px;
}

#pemilu .pod-figure { position: relative; margin-bottom: 8px; }
#pemilu .pod-face {
  width: 62px; height: 62px; border-radius: 50%; overflow: hidden;
  border: 3px solid #FFE6BD; background: var(--parchment-2);
  box-shadow: 0 6px 16px rgba(80,30,0,.32);
  display: flex; align-items: center; justify-content: center;
}
#pemilu .pod-col.r1 .pod-face { width: 78px; height: 78px; border-color: #FFF3D6; }
#pemilu .pod-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
#pemilu .pod-face.is-mascot { background: transparent; border-color: transparent; box-shadow: none; overflow: visible; }
#pemilu .pod-face.is-mascot img {
  width: auto; height: 84px; object-fit: contain;
  filter: drop-shadow(0 7px 13px rgba(80,30,0,.35));
}
#pemilu .pod-col.r1 .pod-face.is-mascot img { height: 104px; }
#pemilu .pod-pair { display: flex; gap: 4px; }
#pemilu .pod-pair .pod-face { width: 46px; height: 46px; border-width: 2.5px; }
#pemilu .pod-col.r1 .pod-pair .pod-face { width: 58px; height: 58px; }
#pemilu .pod-pair .pod-face.is-mascot img { height: 62px; }
#pemilu .pod-col.r1 .pod-pair .pod-face.is-mascot img { height: 76px; }

#pemilu .pod-crown {
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  width: 30px; height: 30px; z-index: 3;
  filter: drop-shadow(0 2px 3px rgba(90,40,5,.4));
  animation: pemilu-crown 2.6s ease-in-out 1.2s infinite;
}
@keyframes pemilu-crown {
  0%,100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  50%     { transform: translateX(-50%) translateY(-3px) rotate(-5deg); }
}

#pemilu .pod-pill {
  background: var(--ink); color: var(--gold-lift);
  border: 2px solid #FFE6BD; border-radius: 999px;
  padding: 5px 11px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 4px 10px rgba(70,25,0,.28);
  margin-bottom: 8px; position: relative; z-index: 3;
}
#pemilu .pod-col.r1 .pod-pill { font-size: 13px; padding: 6px 14px; }
#pemilu .pod-pill small { font-weight: 600; opacity: .8; font-size: .86em; }

#pemilu .pod-block {
  width: 100%; border-radius: 8px 8px 0 0;
  background: linear-gradient(180deg, #FFCB74 0%, #F0A03A 55%, #D9822A 100%);
  border: 1px solid rgba(255,255,255,.4); border-bottom: none;
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 8px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45);
}
#pemilu .pod-block span {
  font-family: var(--display); font-weight: 800; line-height: 1;
  color: rgba(255,255,255,.72); text-shadow: 0 2px 4px rgba(140,70,10,.3);
}
#pemilu .pod-col.r1 .pod-block { height: 108px; }
#pemilu .pod-col.r1 .pod-block span { font-size: 52px; }
#pemilu .pod-col.r2 .pod-block { height: 78px; }
#pemilu .pod-col.r2 .pod-block span { font-size: 40px; }
#pemilu .pod-col.r3 .pod-block { height: 58px; }
#pemilu .pod-col.r3 .pod-block span { font-size: 34px; }

#pemilu .winner-caption {
  text-align: center; padding: 4px 4px 2px;
}
#pemilu .winner-caption .wc-kicker {
  font-size: 10.5px; font-weight: 700; letter-spacing: .2em;
  text-transform: uppercase; color: var(--sepia); margin-bottom: 4px;
}
#pemilu .winner-caption .wc-name {
  font-family: var(--display); font-weight: 800; font-size: 20px;
  letter-spacing: -.02em; color: var(--ink); line-height: 1.15;
}
#pemilu .winner-caption .wc-sub { font-size: 13px; color: var(--mute); margin-top: 5px; }
#pemilu .tie-note {
  margin-top: 10px; padding: 9px 12px; border-radius: 9px;
  background: rgba(245,168,60,.16); border: 1px solid var(--edge);
  font-size: 12.5px; color: var(--sepia); text-align: center; line-height: 1.5;
}

@media (max-width: 380px) {
  #pemilu .pod-col.r1 .pod-face.is-mascot img { height: 88px; }
  #pemilu .pod-face.is-mascot img { height: 68px; }
  #pemilu .pod-pill { font-size: 10.5px; padding: 4px 9px; }
  #pemilu .pod-col.r1 .pod-pill { font-size: 11.5px; }
  #pemilu .pod-name { font-size: 11px; }
  #pemilu .pod-col.r1 .pod-name { font-size: 12.5px; }
}

/* ---------- results ---------- */
#pemilu .tally-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
#pemilu .bignum { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: .95; color: var(--ink); }
#pemilu .bignum small { font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--mute); display: block; margin-top: 5px; }
#pemilu .res { margin-bottom: 15px; }
#pemilu .res:last-child { margin-bottom: 0; }
#pemilu .res-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
#pemilu .res-no { font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--sepia); width: 20px; flex: 0 0 20px; }
#pemilu .res-name { font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
#pemilu .res-num { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); }
#pemilu .res-pct { font-family: var(--body); font-weight: 500; font-size: 12.5px; color: var(--mute); margin-left: 5px; }
#pemilu .track { height: 10px; background: var(--edge-soft); border-radius: 5px; overflow: hidden; margin-left: 28px; }
#pemilu .fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--gold-lift), var(--gold));
  transition: width .6s cubic-bezier(.2,.8,.3,1);
  position: relative; overflow: hidden;
}
#pemilu .fill::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  transform: translateX(-100%);
  animation: pemilu-shimmer 2.4s ease-in-out infinite;
}
@keyframes pemilu-shimmer { 50% { transform: translateX(100%); } 100% { transform: translateX(100%); } }
#pemilu .res.lead .fill { background: linear-gradient(90deg, var(--ember), #B7401A); }
#pemilu .res.lead .res-num { color: var(--ember); }
#pemilu .empty { text-align: center; padding: 22px 6px; color: var(--mute); font-size: 14px; line-height: 1.55; }

/* ---------- admin bits ---------- */
#pemilu .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
#pemilu .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--edge-soft); }
#pemilu .switchrow:last-of-type { border-bottom: none; padding-bottom: 4px; }
#pemilu .switchrow .t { font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
#pemilu .switchrow .s { font-size: 12.5px; color: var(--mute); margin-top: 3px; line-height: 1.5; max-width: 320px; }
#pemilu .switch { width: 48px; height: 28px; flex: 0 0 48px; border-radius: 15px; background: #D9C9AC; border: none; position: relative; transition: background .18s; cursor: pointer; }
#pemilu .switch.on { background: var(--go); }
#pemilu .switch::after { content:""; width: 22px; height: 22px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left .2s cubic-bezier(.3,.8,.3,1); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
#pemilu .switch.on::after { left: 23px; }

/* ---------- kandidat editor ---------- */
#pemilu .cand-editor {
  border: 1.5px solid var(--edge); border-radius: 12px; padding: 14px;
  margin-bottom: 10px; background: #FFFDF7;
}
#pemilu .cand-editor .no {
  font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--sepia);
}
#pemilu .cand-editor .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
#pemilu .cand-editor .kill { background: none; border: none; color: #B8A788; font-size: 22px; line-height: 1; padding: 0 6px; }
#pemilu .cand-editor .kill:hover { color: var(--stop); }
#pemilu .cand-editor .with-photo { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
#pemilu .cand-editor .with-photo .fields { flex: 1; display: grid; gap: 6px; }
#pemilu .cand-editor .with-photo .fields input { margin: 0; }
#pemilu .cand-editor .with-photo .fields input:last-child { font-size: 13px; padding: 9px 12px; }
#pemilu .photo-upload {
  width: 68px; height: 84px; flex: 0 0 68px; border: 1.5px dashed var(--edge);
  border-radius: 8px; overflow: hidden; position: relative; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--parchment-2); font-size: 10.5px; color: var(--sepia); text-align: center; padding: 4px;
  transition: border-color .15s;
}
#pemilu .photo-upload:hover { border-color: var(--sepia); }
#pemilu .photo-upload img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#pemilu .photo-upload input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1; }
#pemilu .photo-upload .clear-x {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: rgba(30,10,0,.75); color: #fff; border: none; font-size: 13px; line-height: 20px;
  display: none; z-index: 2; cursor: pointer;
}
#pemilu .photo-upload.has-img .clear-x { display: block; }
#pemilu .photo-upload.pair { height: 40px; font-size: 9.5px; }
#pemilu .cand-editor .pair-row { display: flex; gap: 8px; margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--edge); }
#pemilu .cand-editor .pair-row .fields { flex: 1; display: grid; gap: 6px; }
#pemilu .cand-editor .pair-row .fields input { margin: 0; font-size: 13px; padding: 9px 12px; }
#pemilu .cand-editor .pair-label { font-size: 11px; font-weight: 700; color: var(--sepia); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
#pemilu .adder {
  width: 100%; padding: 11px; border: 1.5px dashed var(--edge); background: none;
  border-radius: 9px; color: var(--sepia); font-size: 13.5px; font-family: var(--body);
}
#pemilu .adder:hover { border-color: var(--gold); color: var(--ember); background: #FFFAEE; }

/* ---------- misc ---------- */
#pemilu .saveflash {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: var(--ink); color: var(--gold-lift); padding: 10px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 600; z-index: 60; animation: pemilu-flash 2s ease forwards;
  box-shadow: 0 8px 24px rgba(30,10,0,.35);
}
@keyframes pemilu-flash { 0%{opacity:0;transform:translate(-50%,10px)} 12%,74%{opacity:1;transform:translate(-50%,0)} 100%{opacity:0} }
#pemilu .err { color: var(--stop); font-size: 13px; margin-top: -6px; margin-bottom: 12px; }
#pemilu .note { font-size: 12.5px; color: var(--mute); line-height: 1.55; }
#pemilu .voterlist { max-height: 260px; overflow-y: auto; margin-top: 12px; }
#pemilu .voteritem { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--edge-soft); font-size: 13.5px; }
#pemilu .voteritem span:last-child { color: var(--mute); font-size: 12.5px; text-align: right; flex-shrink: 0; }
#pemilu .spin {
  width: 14px; height: 14px; border: 2px solid rgba(255,232,180,.35);
  border-top-color: var(--gold-lift); border-radius: 50%; display: inline-block;
  animation: pemilu-spin .7s linear infinite; vertical-align: -2px; margin-right: 6px;
}
@keyframes pemilu-spin { to { transform: rotate(360deg) } }
#pemilu .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--gold); }
#pemilu .divider::before, #pemilu .divider::after { content: ""; flex: 1; height: 1px; background: var(--edge); }
#pemilu .divider span { font-size: 14px; letter-spacing: 4px; }

@media (prefers-reduced-motion: reduce) {
  #pemilu *, #pemilu *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  #pemilu .print .inked { clip-path: inset(0 0 0 0); }
}

  function simpleHash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16);
  }
  function candidateSetHash() { return simpleHash((cfg.candidates || []).map(c => c.id).sort().join('|')); }
  function deviceFingerprint() {
    const raw = [
      navigator.userAgent || '', (screen.width || 0) + 'x' + (screen.height || 0),
      screen.colorDepth || '', new Date().getTimezoneOffset(), navigator.language || '',
      navigator.hardwareConcurrency || '', navigator.platform || ''
    ].join('::');
    return simpleHash(raw);
  }
  function deviceKey() { return 'devicevote:' + candidateSetHash() + ':' + deviceFingerprint(); }

  async function loadCfg() {
    try {
      const res = await fetch('/api/config');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      cfg = await res.json();
      configLoadError = false;
    } catch (e) {
      cfg = null;
      configLoadError = true;
      storageErr = e && e.message ? e.message : String(e);
    }
  }
  async function saveCfg(flash) {
    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: adminPin, config: cfg }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        storageErr = body.error || ('HTTP ' + res.status);
        toast('Gagal menyimpan: ' + storageErr);
        return false;
      }
      cfg = body;
      if (flash) toast(flash);
      return true;
    } catch (e) {
      storageErr = e && e.message ? e.message : String(e);
      toast('Gagal menyimpan: jaringan bermasalah');
      return false;
    }
  }
  async function allVoteKeys() {
    try {
      const res = await fetch('/api/votes');
      if (!res.ok) return [];
      const rows = await res.json();
      return rows.map(v => ({ cand: v.candidateId, nim: v.nim, nama: v.nama, ts: v.ts }));
    } catch (e) { return []; }

        method: 'POST',

  /* ---------- tally ---------- */
  function tallyOf(keys) {
    const c = {}; (cfg.candidates || []).forEach(k => c[k.id] = 0);
    let total = 0;
    keys.forEach(k => { if (c[k.cand] !== undefined) { c[k.cand]++; total++; } });
    return { counts: c, total };
  }
  function resultsHTML(keys, opts) {
    opts = opts || {};
    const { counts, total } = tallyOf(keys);
    const rows = cfg.candidates.map((c, i) => ({ c, i, n: counts[c.id] })).sort((a, b) => b.n - a.n);
    const lead = rows.length ? rows[0].n : 0;
    const turnout = cfg.target && cfg.target > 0 ? Math.round((total / cfg.target) * 100) : null;
    if (!total) return `<div class="empty">Belum ada suara masuk.<br>Hasil muncul saat pemilih mulai berdatangan.</div>`;
    return `
      <div class="tally-head">
        <div class="bignum">${total}<small>suara tercatat${turnout !== null ? ` &middot; ${turnout}% dari ${cfg.target} DPT` : ''}</small></div>
        ${opts.live ? `<span class="pill admin-open"><span class="dot"></span>Update langsung</span>` : ''}
      </div>
      ${rows.map(({ c, i, n }) => {
        const pct = total ? Math.round(n / total * 100) : 0;
        const nm = cfg.usePair && c.mate ? `${esc(c.name)} & ${esc(c.mate)}` : esc(c.name);
        return `<div class="res ${n === lead && n > 0 ? 'lead' : ''}">

            <span class="res-name">${nm}</span>

        </div>`;
      }).join('')}`;
  }

  function wireCandEditor(container, target) {
    container.querySelectorAll('input[data-i]').forEach(inp => inp.oninput = e => {
      target.candidates[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
    });
    container.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      target.candidates.splice(+b.dataset.x, 1);
      view === 'setup' ? setupView() : adminView();
    });
    container.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const isMate = 'matefile' in e.target.dataset;
      const idx = +(e.target.dataset.file != null ? e.target.dataset.file : e.target.dataset.matefile);
      try {
        const data = await downscaleImage(f, 320);
        target.candidates[idx][isMate ? 'matePhoto' : 'photo'] = data;
        view === 'setup' ? setupView() : adminView();
      } catch (err) { toast('Gagal memproses foto'); }

    container.querySelectorAll('[data-clear-photo]').forEach(b => b.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      target.candidates[+b.dataset.clearPhoto].photo = '';
      view === 'setup' ? setupView() : adminView();
    });
    container.querySelectorAll('[data-clear-matephoto]').forEach(b => b.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      target.candidates[+b.dataset.clearMatephoto].matePhoto = '';
      view === 'setup' ? setupView() : adminView();
    });
  }

  function downscaleImage(file, maxSide) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => reject(new Error('image decode'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('file read'));
      reader.readAsDataURL(file);
    });
  }

    stage.innerHTML = `

    const submit = async () => {
      const nim = stage.querySelector('#vn').value.trim();

      const err = stage.querySelector('#verr');
      if (!normNim(nim) || !nama) { err.textContent = 'NIM dan nama wajib diisi.'; err.style.display = 'block'; return; }
      const btn = stage.querySelector('#vgo');
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Memeriksa';
      const keys = await allVoteKeys();
      const found = keys.find(k => k.nim === normNim(nim));
      let deviceBlocked = false;
      if (!found && cfg.deviceLock) {
        try {
          const r = await fetch('/api/device-check?key=' + encodeURIComponent(deviceFingerprint()));
          const body = await r.json().catch(() => ({ blocked: false }));
          deviceBlocked = !!body.blocked;
        } catch (e) {}
      }
      voter = { nim: normNim(nim), nama, votedFor: found ? found.cand : undefined, deviceBlocked };
      if (!found) delete voter.votedFor;
      paint();
    };
    stage.querySelector('#vgo').onclick = submit;
    stage.querySelector('#vm').onkeydown = e => { if (e.key === 'Enter') submit(); };
  }

                <span class="choice-name">${esc(c.name)}</span>
                ${cfg.usePair && c.mate ? `<span class="choice-mate"><span class="lbl">Wakil:</span> ${esc(c.mate)}</span>` : ''}
                ${c.visi ? `<span class="choice-visi">${esc(c.visi)}</span>` : ''}
              </span>
              <span class="tick"></span>
            </button>`).join('')}
        </div>
        <button class="btn solid" id="bgo" ${picked ? '' : 'disabled'}>Kirim suara</button>

      </div>
      <div class="footer"><button class="textlink" id="bback">Bukan saya</button></div>`;
    stage.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      picked = b.dataset.id;
      stage.querySelectorAll('.choice').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === picked));
      stage.querySelector('#bgo').disabled = false;
    });
    stage.querySelector('#bback').onclick = () => { voter = null; picked = null; paint(); };
    stage.querySelector('#bgo').onclick = () => {
      if (modalOpen) return;
      stage.querySelector('#bgo').disabled = true;

    };

  // Di sandbox artifact, position:fixed sering tidak menutupi viewport
  // parent. Modal diposisikan manual dekat elemen yang baru diklik user,
  // sehingga selalu berada di area yang sedang terlihat.
  // Modal selalu ditaruh di tengah area layar yang SEDANG terlihat (bukan
  // di tengah seluruh halaman), jadi user tidak perlu scroll untuk
  // melihatnya utuh. Kalau kontennya lebih tinggi dari layar, modal
  // dibatasi tingginya dan isinya sendiri yang bisa discroll.
  function centerModal(modalEl) {
    if (!modalEl) return;
    const rootRect = root.getBoundingClientRect();
    const vh = window.innerHeight;
    const maxH = Math.max(240, vh - 28);
    modalEl.style.maxHeight = maxH + 'px';
    modalEl.style.overflowY = 'auto';
    const modalH = Math.min(modalEl.offsetHeight, maxH);
    const top = (vh - modalH) / 2 - rootRect.top;
    modalEl.style.top = Math.max(14, top) + 'px';
  }

  // Pengganti window.confirm() bawaan browser, yang di sandbox artifact
  // bisa diam-diam diblokir (dialog tidak pernah muncul, klik terasa
  // seperti tidak melakukan apa-apa). Modal ini tidak bergantung pada
  // API dialog native sama sekali.
  function customConfirm(opts, anchorEl) {
    return new Promise(resolve => {
      const scrim = document.createElement('div');
      scrim.className = 'scrim';
      scrim.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-strap">${esc(opts.strap || 'Konfirmasi')}</div>
          <div class="modal-body">
            <h2>${esc(opts.heading || 'Yakin?')}</h2>
            <p class="subtle">${esc(opts.message || '')}</p>
          </div>
          <div class="modal-actions">
            <button class="btn ${opts.danger ? 'danger' : 'gold'}" id="ccyes">${esc(opts.confirmLabel || 'Ya, lanjutkan')}</button>
            <button class="btn line" id="ccno">${esc(opts.cancelLabel || 'Batal')}</button>
          </div>
        </div>`;
      root.appendChild(scrim);
      requestAnimationFrame(() => centerModal(scrim.querySelector('.modal')));
      const cleanup = result => { scrim.remove(); resolve(result); };
      scrim.querySelector('#ccno').onclick = () => cleanup(false);
      scrim.querySelector('#ccyes').onclick = () => cleanup(true);
      scrim.onclick = e => { if (e.target === scrim) cleanup(false); };
    });
  }

  function openConfirm() {
    if (!picked || modalOpen) return;
    modalOpen = true;
    const c = cfg.candidates.find(x => x.id === picked);
    const idx = cfg.candidates.findIndex(x => x.id === picked) + 1;
    const displayName = cfg.usePair && c.mate ? `${esc(c.name)} &amp; ${esc(c.mate)}` : esc(c.name);
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-strap">Apakah Anda Yakin?</div>
        <div class="modal-body">
          <h2>Kirim suara sekarang?</h2>
          <p class="subtle">Pastikan pilihan Anda sudah benar. Setelah dikirim, suara tidak dapat diubah, diulang, atau ditarik kembali.</p>
          <div class="confirm-card">
            <span class="numeral">${idx}</span>
            <span style="flex:1">
              <span class="choice-role">${cfg.usePair ? 'Paslon' : 'Calon'} nomor urut ${idx}</span>
              <span class="choice-name">${displayName}</span>
            </span>
          </div>
          <div class="confirm-line">Atas nama <b>${esc(voter.nama)}</b> · NIM <b>${esc(voter.nim)}</b></div>
        </div>
        <div class="modal-actions">
          <button class="btn gold" id="cyes">Ya, saya yakin, kirim suara</button>
          <button class="btn line" id="cno">Batal, pilih lagi</button>
        </div>
      </div>`;
    root.appendChild(scrim);
    requestAnimationFrame(() => centerModal(scrim.querySelector('.modal')));

    let submitting = false;
    const close = () => {
      if (submitting) return;
      modalOpen = false; scrim.remove();
      const bgoBtn = stage.querySelector('#bgo');
      if (bgoBtn) bgoBtn.disabled = false;
    };
    scrim.querySelector('#cno').onclick = close;
    scrim.onclick = e => { if (e.target === scrim) close(); };
    scrim.querySelector('#cyes').onclick = async () => {
      if (submitting) return;
      submitting = true;
      const b = scrim.querySelector('#cyes'), cnoBtn = scrim.querySelector('#cno');
      b.disabled = true; b.innerHTML = '<span class="spin"></span>Mengirim suara';
      if (cnoBtn) cnoBtn.disabled = true;
      try {
        const res = await fetch('/api/cast-vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            candidateId: picked, nim: voter.nim, nama: voter.nama,
            deviceKey: cfg.deviceLock ? deviceFingerprint() : undefined,
          }),
        });
        const body = await res.json().catch(() => ({ ok: false, reason: 'server-error' }));
        if (body.ok) {
          voter.votedFor = picked;
          modalOpen = false; scrim.remove(); paint();
          return;
        }
        modalOpen = false; scrim.remove();
        if (body.reason === 'duplicate') {
          voter.votedFor = body.candidateId || null;
          if (!voter.votedFor) delete voter.votedFor;
        } else if (body.reason === 'device') {
          voter.deviceBlocked = true;
        } else if (body.reason === 'closed') {
          cfg.isOpen = false;
        }
        paint();
      } catch (e) {
        submitting = false;
        b.disabled = false; b.textContent = 'Gagal terkirim, coba lagi';
        if (cnoBtn) cnoBtn.disabled = false;
      }
    };
  }

  /* ---------- podium pemenang ---------- */
  function crownSvg() {
    return `<svg class="pod-crown" viewBox="0 0 32 26" aria-hidden="true">
      <path d="M3 22 L2 7 L10 12 L16 3 L22 12 L30 7 L29 22 Z"
            fill="#FFCB4E" stroke="#B7791A" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="2.1" fill="#B7791A"/>
    </svg>`;
  }

  function podFace(c, rank) {
    // Foto kandidat kalau ada; kalau tidak, pakai maskot burung Kencana
    const mascot = rank % 2 === 0 ? MASCOT_L : MASCOT_R;
    const one = (src, isPhoto) => isPhoto
      ? `<div class="pod-face"><img src="${src}" alt=""></div>`
      : `<div class="pod-face is-mascot"><img src="${src}" alt=""></div>`;
    if (cfg.usePair) {
      const a = c.photo ? one(c.photo, true) : one(mascot, false);
      const b = c.matePhoto ? one(c.matePhoto, true) : one(rank % 2 === 0 ? MASCOT_R : MASCOT_L, false);
      return `<div class="pod-pair">${a}${b}</div>`;
    }
    return c.photo ? one(c.photo, true) : one(mascot, false);
  }

  function podColumn(entry, rank, total) {
    const { c, i, n } = entry;
    const pct = total ? Math.round(n / total * 100) : 0;
    return `
      <div class="pod-col r${rank}">
        <div class="pod-name">${esc(c.name)}${cfg.usePair && c.mate ? `<span class="pod-mate">&amp; ${esc(c.mate)}</span>` : ''}</div>
        <div class="pod-figure">${rank === 1 ? crownSvg() : ''}${podFace(c, i)}</div>
        <div class="pod-pill">${n} suara <small>&middot; ${pct}%</small></div>
        <div class="pod-block"><span>${rank}</span></div>
      </div>`;
  }

  function podiumMarkup(keys) {
    const { counts, total } = tallyOf(keys);
    if (!total) {
      return `<div class="empty">Pemilihan ditutup tanpa suara yang masuk.</div>`;
    }
    const rows = cfg.candidates
      .map((c, i) => ({ c, i, n: counts[c.id] || 0 }))
      .sort((a, b) => b.n - a.n);
    const top = rows.slice(0, 3);
    // Urutan tampil: juara 2 di kiri, juara 1 di tengah, juara 3 di kanan
    const layout = [
      { entry: top[1], rank: 2 },
      { entry: top[0], rank: 1 },
      { entry: top[2], rank: 3 },
    ].filter(x => x.entry);

    const tie = top.length > 1 && top[0].n === top[1].n;
    const champ = top[0];
    const champName = cfg.usePair && champ.c.mate
      ? `${esc(champ.c.name)} & ${esc(champ.c.mate)}`
      : esc(champ.c.name);

    return `
      <div class="podium-stage">
        <div class="podium-row">
          ${layout.map(x => podColumn(x.entry, x.rank, total)).join('')}
        </div>
      </div>
      <div class="winner-caption">
        <div class="wc-kicker">${tie ? 'Perolehan suara tertinggi' : 'Pemenang'}</div>
        <div class="wc-name">${champName}</div>
        <div class="wc-sub">${champ.n} suara dari ${total} suara sah &middot; nomor urut ${champ.i + 1}</div>
      </div>
      ${tie ? `<div class="tie-note">Ada perolehan suara yang sama di posisi teratas. Penentuan pemenang diserahkan kepada mekanisme yang berlaku di organisasi.</div>` : ''}`;
  }

    const reopenBtn = stage.querySelector('#areopen');
    if (reopenBtn) reopenBtn.onclick = async () => {
      const ok = await customConfirm({
        strap: 'Buka Kembali',
        heading: 'Buka kembali pemilihan ini?',
        message: 'Papan pemenang akan disembunyikan dan peserta bisa mengirim suara lagi seperti biasa.',
        confirmLabel: 'Ya, buka kembali',
        cancelLabel: 'Batal',
      }, reopenBtn);
      if (!ok) return;
      cfg.finalized = false; cfg.isOpen = true;
      await saveCfg('Pemilihan dibuka kembali');
      adminView();
    };
    if (cfg.finalized) {
      allVoteKeys().then(keys => {
        const p = stage.querySelector('#apodium');
        if (p) p.innerHTML = podiumMarkup(keys);
      });
    }

    stage.querySelector('#awipe').onclick = async () => {
      const awipeBtn = stage.querySelector('#awipe');
      const ok = await customConfirm({
        strap: 'Setel Ulang',
        heading: 'Hapus semua suara yang sudah masuk?',
        message: 'Judul, kandidat, dan PIN tetap tersimpan. Cuma suaranya yang hilang. Tindakan ini tidak dapat dibatalkan.',
        confirmLabel: 'Ya, hapus semua suara',
        cancelLabel: 'Batal',
        danger: true,
      }, awipeBtn);
      if (!ok) return;
      try {
        const res = await fetch('/api/admin-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: adminPin }),
        });
        if (!res.ok) { toast('Gagal menghapus suara'); return; }
        toast('Semua suara dihapus'); adminView();
      } catch (e) { toast('Gagal menghapus suara: jaringan bermasalah'); }
    };

    refreshTally();
  }

  async function refreshTally() {
    const box = stage.querySelector('#atally'); if (!box) return;
    const keys = await allVoteKeys();
    const b2 = stage.querySelector('#atally'); if (!b2) return;
    b2.innerHTML = resultsHTML(keys, { live: cfg.isOpen });
  }

  function startPoll() {
    if (poll) clearInterval(poll);
    poll = setInterval(async () => {
      if (modalOpen) return;
      const before = cfg ? cfg.rev : -1;
      await loadCfg();
      if (view === 'admin' && adminOK) { refreshTally(); return; }
      if (view === 'setup' || view === 'gate') return;
      const after = cfg ? cfg.rev : -1;
      if (before !== after) {
        if (picked && cfg && !cfg.candidates.some(c => c.id === picked)) picked = null;
        paint();
      } else if (cfg && cfg.published && stage.querySelector('#pub')) {
        fillPublic();
      }
    }, 6000);
  }

  async function init() {
    stage.innerHTML = `<div class="sheet"><div class="empty">Memuat…</div></div>`;
    root.classList.remove('booth', 'wide');
    await loadCfg();
    if (configLoadError) {
      stage.innerHTML = `
        <div class="sheet">
          <div class="head"><h1>Tidak bisa terhubung ke server</h1>
          <p class="lede">Halaman ini gagal memuat data dari backend. Cek koneksi internet, atau backend belum tersambung ke database (Vercel KV).</p></div>
          <div class="field"><label>Pesan teknis</label>
          <p class="note" style="padding:12px;background:var(--parchment-2);border-radius:9px;border:1px solid var(--edge)">${esc(storageErr || 'tidak diketahui')}</p></div>
          <button class="btn line" id="retry">Coba lagi</button>
        </div>`;
      stage.querySelector('#retry').onclick = () => init();
      return;
    }
    paint();
    startPoll();
  }
  init();
})();
</script>
